<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Typing Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 20px; }
        .stats-box {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #eef2f3;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .stat { color: #2c3e50; }
        #text-to-type {
            background: #f9f9f9;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-align: left;
            line-height: 1.6;
            user-select: none;
        }
        textarea {
            width: 95%;
            height: 120px;
            font-size: 1.1rem;
            padding: 12px;
            border: 2px solid #3498db;
            border-radius: 8px;
            resize: none;
            outline: none;
        }
        textarea:disabled { background: #f0f0f0; border-color: #ccc; }
        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 1rem;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h1>⌨️ Speed Typing Test</h1>
    
    <div class="stats-box">
        <div class="stat">Time Left: <span id="timer">60</span>s</div>
        <div class="stat">WPM: <span id="wpm">0</span></div>
        <div class="stat">Accuracy: <span id="accuracy">100</span>%</div>
    </div>

    <div id="text-to-type">Loading text...</div>

    <textarea id="input-field" placeholder="Yahan dekh kar type karna shuru karein... Timer khud shuru ho jayega."></textarea>
    
    <br>
    <button id="btn-restart">Try Again</button>
</div>

<script>
    const paragraphs = [
        "The quick brown fox jumps over the lazy dog. This classic phrase contains every single letter in the English alphabet.",
        "Success is not final, failure is not fatal: it is the courage to continue that counts in the journey of life.",
        "Technology is advancing at a rapid pace. Learning how to code opens up endless possibilities for the future generation.",
        "Consistency is the key to mastering any skill. The more you practice typing every day, the faster and more accurate you will become."
    ];

    const textDisplay = document.getElementById("text-to-type");
    const inputField = document.getElementById("input-field");
    const timerDisplay = document.getElementById("timer");
    const wpmDisplay = document.getElementById("wpm");
    const accuracyDisplay = document.getElementById("accuracy");
    const restartBtn = document.getElementById("btn-restart");

    let timer = 60;
    let maxTime = 60;
    let timerInterval = null;
    let isTyping = false;

    function loadParagraph() {
        const randomIndex = Math.floor(Math.random() * paragraphs.length);
        textDisplay.innerHTML = paragraphs[randomIndex];
        inputField.value = "";
        clearInterval(timerInterval);
        timer = maxTime;
        timerDisplay.innerText = timer;
        wpmDisplay.innerText = 0;
        accuracyDisplay.innerText = 100;
        isTyping = false;
        inputField.disabled = false;
        inputField.focus();
    }

    function startTimer() {
        if (timer > 0) {
            timer--;
            timerDisplay.innerText = timer;
            
            // WPM calculation
            let wordsTyped = inputField.value.trim().split(/\s+/).filter(word => word.length > 0).length;
            let timeElapsed = (maxTime - timer) / 60;
            let wpm = Math.round(wordsTyped / timeElapsed);
            wpmDisplay.innerText = wpm >= 0 && wpm !== Infinity ? wpm : 0;
        } else {
            clearInterval(timerInterval);
            inputField.disabled = true;
            alert("Time's up! Check your final score.");
        }
    }

    inputField.addEventListener("input", () => {
        const originalText = textDisplay.innerText;
        const typedText = inputField.value;

        // Start timer on first keystroke
        if (!isTyping && typedText.length > 0) {
            isTyping = true;
            timerInterval = setInterval(startTimer, 1000);
        }

        // Live Accuracy calculation
        let mistakes = 0;
        for (let i = 0; i < typedText.length; i++) {
            if (typedText[i] !== originalText[i]) {
                mistakes++;
            }
        }
        let accuracy = Math.round(((typedText.length - mistakes) / typedText.length) * 100);
        accuracyDisplay.innerText = typedText.length > 0 ? (accuracy < 0 ? 0 : accuracy) : 100;
    });

    restartBtn.addEventListener("click", loadParagraph);

    // Initial Load
    window.onload = loadParagraph;
</script>

</body>
</html>
