<!doctype html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Website Saathi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Figtree:wght@400;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#EEF2F1;--panel:#fff;--ink:#10243A;--muted:#566776;--line:#C5D0D6;--accent:#2457D6;--on:#fff;--err:#B3261E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1822;--panel:#152433;--ink:#E7EEF4;--muted:#93A4B3;--line:#27394A;--accent:#7FA4FF;--on:#0E1822;--err:#FF8A80}}
:root[data-theme="dark"]{--bg:#0E1822;--panel:#152433;--ink:#E7EEF4;--muted:#93A4B3;--line:#27394A;--accent:#7FA4FF;--on:#0E1822;--err:#FF8A80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Figtree,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 48px}
h1{font:700 2rem/1.15 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.tasks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tasks button{font:inherit;font-weight:600;padding:9px 14px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;cursor:pointer}
.tasks button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label{display:block;font-weight:600;margin-bottom:6px}
textarea{width:100%;box-sizing:border-box;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);resize:vertical}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{font:inherit;font-weight:600;margin-top:12px;padding:12px 22px;border:0;border-radius:10px;background:var(--accent);color:var(--on);cursor:pointer}
.primary:disabled{opacity:.6;cursor:wait}
#out{margin-top:26px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
#status{flex:1;color:var(--muted);font-size:.9rem;min-width:140px}
.bar button{font:inherit;font-size:.9rem;font-weight:600;padding:6px 12px;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
pre{margin:0;padding:14px;white-space:pre-wrap;word-break:break-word;font:.88rem/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:70vh;overflow:auto}
.more{display:flex;gap:8px;padding:12px;border-top:1.5px solid var(--line);align-items:flex-end}
.more textarea{flex:1}
.more .primary{margin:0;padding:10px 14px}
#err{color:var(--err);margin:12px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Website Saathi</h1>
<p class="sub">Website banane aur chalane ka kaam, aap ke liye.</p>
<div class="tasks">
<button data-t="build">Nayi website banao</button>
<button data-t="seo">SEO likho</button>
<button data-t="fix">Masla theek karo</button>
<button data-t="content">Content likho</button>
</div>
<label for="inp" id="lab"></label>
<textarea id="inp" rows="6"></textarea>
<button class="primary" id="go">Shuru karo</button>
<p id="err" role="alert"></p>
<section id="out" hidden>
<div class="bar">
<span id="status" aria-live="polite"></span>
<button id="copy">Copy</button>
<button id="dl" hidden>index.html save karo</button>
</div>
<pre id="res"></pre>
<div class="more">
<textarea id="fu" rows="2" aria-label="Badlav" placeholder="Badlav batayein, jaise: rang neela kar do"></textarea>
<button class="primary" id="fub">Badlav karo</button>
</div>
</section>
</main>
<script>
const P="Tum ek madadgar AI agent ho jo ek beginner ki website ke kaam mein madad karta hai. Jawab saade Roman Urdu mein do; code aur technical lafz English mein rakho.\n\n";
const T={
build:{l:"Aap kaisi website banana chahte hain?",p:"Jaise: Age calculator. Visitor apni date of birth daale to umar saal, mahine aur din mein dikhe.",
s:P+"Task: User ki description ke mutabiq ek mukammal, mobile-friendly website banao jo sirf ek file (index.html, CSS aur JS andar) mein ho. Saaf design, tez load, SEO ke liye title aur meta description, aur do jagah khali 'Ad yahan' box rakho. Pehle 2-3 line mein batao kya banaya, phir ek ```html code block do, phir 3 aasaan steps mein batao ke isay free mein live kaise karein."},
seo:{l:"Kis website ya page ke liye SEO chahiye?",p:"Jaise: kg se gram convert karne wala page",
s:P+"Task: Diye gaye page ya website ke liye SEO do: 3 title options (60 characters se kam), ek meta description (155 characters se kam), 10 keywords, 5 FAQ sawal-jawab aur 3 blog topics. SEO ka text website ki zubaan mein likho, baqi samjhana Roman Urdu mein."},
fix:{l:"Masla ya code yahan paste karein",p:"Jaise: mera button mobile par nazar nahi aata. (Code bhi paste kar sakte hain)",
s:P+"Task: User ka masla ya code dekho. Pehle wajah aasaan alfaaz mein batao, phir theek kiya hua poora code ek code block mein do (HTML ho to ```html), aur batao kya badla."},
content:{l:"Kis cheez par content chahiye?",p:"Jaise: 'Sunrise aur sunset ka waqt' page ke liye 300 alfaaz ka taaruf",
s:P+"Task: User ki website ke liye asli, insaan jaisa likha hua content likho. Jhooti ya ghair-tasdeeq-shuda baatein na likho. Content ki zubaan wahi rakho jo user ne maangi ho."}
};
const $=id=>document.getElementById(id);
let cur="build",hist=[],busy=false,code="",lastOut="";
function say(m){$("status").textContent=m}
function pick(t){
  if(busy)return;
  cur=t;hist=[];code="";lastOut="";
  $("out").hidden=true;$("err").textContent="";
  document.querySelectorAll(".tasks button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===t)));
  $("lab").textContent=T[t].l;$("inp").placeholder=T[t].p;
}
function show(text){
  $("res").textContent=text;
  const m=text.match(/```html\s*\n([\s\S]*?)```/);
  code=m?m[1].trim():"";
  $("dl").hidden=!code;
}
async function run(text,first){
  text=text.trim();
  if(busy||!text)return;
  $("err").textContent="";
  const c=window.claude;
  const sample=c&&c.use?await c.use("sample"):null;
  if(!sample){$("err").textContent="Yahan AI chalne ki ijazat nahi mili. Page ko claude.ai mein kholein aur ijazat dein.";return}
  busy=true;$("go").disabled=$("fub").disabled=true;
  $("out").hidden=false;say("Kaam ho raha hai...");
  if(first){hist=[{role:"user",content:T[cur].s+"\n\nUser ki request:\n"+text}];lastOut="";show("")}
  else hist.push({role:"user",content:text});
  try{
    const r=await sample(hist,{cache:false,onText:({text:t})=>show(t)});
    hist.push({role:"assistant",content:r.text});
    lastOut=r.text;show(r.text);
    say(r.truncated?"Jawab adhoora reh gaya. 'Badlav karo' se aage barhayein.":"Tayyar hai.");
    if(!first)$("fu").value="";
  }catch(e){
    hist.pop();
    show((e&&e.text)||lastOut);say("");
    $("err").textContent=e&&e.code==="rate_limited"?"Thori der baad dobara koshish karein.":e&&e.code==="not_granted"?"AI chalane ki ijazat nahi di gayi.":"Kuch masla aa gaya, dobara koshish karein.";
  }finally{busy=false;$("go").disabled=$("fub").disabled=false}
}
document.querySelectorAll(".tasks button").forEach(b=>b.onclick=()=>pick(b.dataset.t));
$("go").onclick=()=>run($("inp").value,true);
$("fub").onclick=()=>run($("fu").value,false);
$("copy").onclick=async()=>{
  try{await navigator.clipboard.writeText(code||$("res").textContent);say("Copy ho gaya.")}
  catch(e){const r=document.createRange();r.selectNodeContents($("res"));const s=getSelection();s.removeAllRanges();s.addRange(r);say("Text select ho gaya, ab copy karein.")}
};
$("dl").onclick=async()=>{
  const c=window.claude;
  const d=c&&c.use?await c.use("downloads"):null;
  if(!d){say("Save yahan nahi ho sakta, Copy istemal karein.");return}
  try{await d.save({filename:"index.html",data:code});say("index.html save ho gayi.")}
  catch(e){say("Save nahi hua, Copy istemal karein.")}
};
pick("build");
</script>
</body>
</html>
